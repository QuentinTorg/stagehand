# Common recovery record; omit unused fields, adding evidence only as needed.
task_id: "<stable-task-id>"
mode: "development|reviewer-only|delegated-work|workspace-only"
objective: "<human-authorized-outcome-or-purpose>"
intent_ref: "<plan, PR, issue, or human-request-reference>"
repository:
  name: "<configured-repository-name>"
  root: "<canonical-primary-checkout>"
  worktree: "<task-owned-checkout>"
  remote: "origin"
  base: "<base-branch>"
  base_commit: "<starting-commit>"
  branch: "<task-branch>"
# Only for submodule work; record each target separately for multi-repo work.
development_target:
  path: "<relative-submodule-path>"
  remote: "origin"
  base: "<target-base-branch>"
  base_commit: "<target-starting-commit>"
  branch: "<target-feature-branch>"
  containing_repository_pointer_update: "not-planned|planned"
workspace:
  id: "<herdr-workspace-id>"
  label: "<live-sidebar-label>"
agents: {} # Role -> exact agent name; only roles actually created.
role_sessions: {} # Role -> pane, native session ID, and model/effort when available.
wake:
  watches: {} # Role -> persistent watch ID.
pull_requests: [] # PR URLs; preserve repository/host identities.
state:
  name: "active"
  summary: "<current-work-or-outcome>"
  next_role: null # author, reviewer, worker, workspace_agent, orchestrator, or human
  next_action: "<concrete-next-step>"
  attention_required: false
  attention_reason: null
# Optional: latest result/verification reference, per-PR reviewed head/outcome,
# selected feedback, and relevant human decisions with their source and scope.
# No counters or readiness/cleanup booleans; verify consequential state when acting.
