id = "stagehand.managed-agent-wake"
name = "Stagehand Managed Agent Wake"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Wake a Stagehand orchestrator when an explicitly watched agent turn settles."
platforms = ["linux", "macos"]

[[startup]]
command = ["./stagehand-wake", "flush"]

[[events]]
on = "pane.agent_status_changed"
command = ["./stagehand-wake", "hook"]
