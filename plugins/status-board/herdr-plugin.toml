id = "quentintorg.stagehand-board"
name = "Stagehand Status Board"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "View Stagehand tasks and orchestrator output, navigate workspaces, and message the orchestrator."
platforms = ["linux", "macos"]

[[startup]]
command = ["python3", "resume.py"]

[[panes]]
id = "board"
title = "Stagehand status"
placement = "split"
command = ["python3", "board.py"]
