id = "quentintorg.agent-wake"
name = "Agent Wake Relay"
version = "0.2.0"
min_herdr_version = "0.8.2"
description = "Wake a controller when a registered agent settles, across one or many turns."
platforms = ["linux", "macos"]

[[startup]]
command = ["./agent-wake", "flush"]

[[events]]
on = "pane.agent_status_changed"
command = ["./agent-wake", "hook"]
